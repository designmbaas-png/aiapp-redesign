<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiApp — 모바일 반응형 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --accent:#2B5CE6; --ink:#0E1626; --muted:#5B6577; --line:#E4E9F2; --paper:#F7F9FC; --surface:#fff;
    --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --device-w:390px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#EEF1F7;color:var(--ink);font-family:var(--font);line-height:1.5;padding:28px 20px 60px;}
  .head{max-width:1400px;margin:0 auto 24px;}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;}
  .desc{font-size:14px;color:var(--muted);margin-top:6px;}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;}
  .toolbar .label{font-size:12.5px;font-weight:700;color:var(--muted);}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .15s;}
  .seg button.on{background:var(--accent);color:#fff;}
  .hint{font-size:12px;color:var(--muted);margin-left:auto;}
  .stage{max-width:1400px;margin:0 auto;display:flex;gap:26px;overflow-x:auto;padding:6px 2px 20px;-webkit-overflow-scrolling:touch;}
  .device{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .device .cap{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:-.01em;}
  .device .cap b{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .device .cap .w{font-family:var(--font);font-size:11px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px;}
  .frame{position:relative;width:var(--device-w);height:812px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:10px;box-shadow:0 20px 44px -22px rgba(14,22,38,.28);transition:width .2s ease;}
  .frame .notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:110px;height:5px;border-radius:3px;background:#E4E9F2;z-index:2;}
  .frame iframe{width:100%;height:100%;border:0;border-radius:18px;background:#fff;display:block;}
  .open{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;}
  .open:hover{text-decoration:underline;}
  @media(max-width:640px){ body{padding:18px 12px 40px;} .stage{gap:16px;} }
</style>
</head>
<body>
  <div class="head">
    <h1>AiApp 모바일 반응형 미리보기</h1>
    <p class="desc">5개 화면을 실제 모바일 폭으로 나란히 띄웠습니다. 가로로 스크롤하며 확인하고, 수정할 부분을 “어느 화면 / 어느 영역 / 어떻게”로 알려주시면 반영하겠습니다. 각 프레임 안에서 위아래로 스크롤됩니다.</p>
    <div class="toolbar">
      <span class="label">기기 폭</span>
      <div class="seg" id="seg">
        <button data-w="360">360</button>
        <button data-w="390" class="on">390</button>
        <button data-w="414">414</button>
      </div>
      <span class="hint">↔ 좌우로 스크롤하면 5개 화면 모두 보입니다</span>
    </div>
  </div>

  <div class="stage" id="stage">
    <!-- 각 화면 -->
    <div class="device">
      <div class="cap"><b></b> 홈 <span class="w">index.html</span></div>
      <div class="frame"><span class="notch"></span><iframe src="index.html" title="홈" loading="lazy"></iframe></div>
      <a class="open" href="index.html" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>
    <div class="device">
      <div class="cap"><b></b> 템플릿 <span class="w">templates.html</span></div>
      <div class="frame"><span class="notch"></span><iframe src="templates.html" title="템플릿" loading="lazy"></iframe></div>
      <a class="open" href="templates.html" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>
    <div class="device">
      <div class="cap"><b></b> 요금제 <span class="w">pricing.html</span></div>
      <div class="frame"><span class="notch"></span><iframe src="pricing.html" title="요금제" loading="lazy"></iframe></div>
      <a class="open" href="pricing.html" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>
    <div class="device">
      <div class="cap"><b></b> 블로그 <span class="w">blog.html</span></div>
      <div class="frame"><span class="notch"></span><iframe src="blog.html" title="블로그" loading="lazy"></iframe></div>
      <a class="open" href="blog.html" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>
    <div class="device">
      <div class="cap"><b></b> 공지 <span class="w">notice.html</span></div>
      <div class="frame"><span class="notch"></span><iframe src="notice.html" title="공지" loading="lazy"></iframe></div>
      <a class="open" href="notice.html" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>
  </div>

  <script>
    // 기기 폭 전환
    const seg = document.getElementById('seg');
    seg.addEventListener('click', e=>{
      const btn = e.target.closest('button'); if(!btn) return;
      seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===btn));
      document.documentElement.style.setProperty('--device-w', btn.dataset.w + 'px');
    });
  </script>
</body>
</html>
